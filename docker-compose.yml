# FactoryOps local stack. All data is synthetic.
# Usage: cp .env.example .env && docker compose up --build
name: factoryops

x-backend-env: &backend-env
  FACTORYOPS_ENV: ${FACTORYOPS_ENV:-docker}
  FACTORYOPS_DATABASE_URL: postgresql+psycopg://factoryops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/factoryops
  FACTORYOPS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  FACTORYOPS_LOG_LEVEL: ${FACTORYOPS_LOG_LEVEL:-INFO}
  FACTORYOPS_DEMO_CONTROLS_ENABLED: ${FACTORYOPS_DEMO_CONTROLS_ENABLED:-true}
  FACTORYOPS_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factoryops
      POSTGRES_USER: factoryops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryops -d factoryops"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic factoryops.telemetry --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic factoryops.telemetry.dlq --partitions 1 --replication-factor 1
    restart: "no"

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Registers the simulated equipment fleet (idempotent, no history). Without it every simulated
  # event is rejected as unknown_equipment.
  fleet-init:
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "factoryops.cli", "register-fleet"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  consumer:
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "factoryops.consumer"]
    depends_on:
      fleet-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    # Exits non-zero (without committing) if the DB stays unavailable; restart redelivers.
    restart: unless-stopped

  simulator:
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "factoryops.simulator", "--transport", "kafka", "--scenario", "${SIM_SCENARIO:-mixed}", "--interval", "${SIM_INTERVAL:-2}", "--seed", "${SIM_SEED:-42}", "--forever"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      fleet-init:
        condition: service_completed_successfully
      consumer:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
