name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factoryops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: factoryops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factoryops" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FACTORYOPS_TEST_DATABASE_URL: postgresql+psycopg://factoryops:ci-only-password@localhost:5432/factoryops_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations apply and match models
        env:
          FACTORYOPS_DATABASE_URL: ${{ env.FACTORYOPS_TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Build images
        run: docker compose build migrate frontend
